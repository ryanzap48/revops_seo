# Render Blueprint. Create the service with: Render dashboard → New → Blueprint.
# The Node version comes from "engines" in package.json.
services:
  - type: web
    name: revops-seo
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      # Node otherwise assumes it may use ~2 GB and lets its heap grow until the
      # container OOM-kills it. Capping the heap makes V8 collect instead of
      # expand: a measured 70-page crawl peaks at ~200 MB with this set, versus
      # ~490 MB without, at identical speed. Raise with the instance size.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
